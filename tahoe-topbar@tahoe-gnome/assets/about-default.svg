<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340"
     viewBox="0 0 512 340" role="img"
     aria-label="Portátil MacBook con fondo de pantalla azul y morado">
  <defs>
    <!-- Carcasa de aluminio de la pantalla -->
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="0.38" stop-color="#e2e3e8"/>
      <stop offset="0.72" stop-color="#c9cbd2"/>
      <stop offset="1" stop-color="#aeb1b9"/>
    </linearGradient>

    <!-- Base -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f6f8"/>
      <stop offset="0.35" stop-color="#dcdde3"/>
      <stop offset="0.7" stop-color="#c2c4cb"/>
      <stop offset="1" stop-color="#a2a5ad"/>
    </linearGradient>

    <!-- Bisel negro de la pantalla -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242429"/>
      <stop offset="0.5" stop-color="#151519"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>

    <!-- Fondo de pantalla estilo Tahoe -->
    <linearGradient id="wallpaper" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#061a4f"/>
      <stop offset="0.28" stop-color="#123fb4"/>
      <stop offset="0.55" stop-color="#4e50f0"/>
      <stop offset="0.78" stop-color="#9a55f2"/>
      <stop offset="1" stop-color="#ec7bd1"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0.18" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#6fd8ff" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#2e9dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2e9dff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="0.88" cy="0.88" r="0.75">
      <stop offset="0" stop-color="#ff9ad8" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff6fbe" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6fbe" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="76" y="40" width="360" height="216" rx="5" ry="5"/>
    </clipPath>
  </defs>

  <!-- Sombra suave bajo el equipo -->
  <ellipse cx="256" cy="307" rx="218" ry="11"
           fill="#000000" opacity="0.10"/>
  <ellipse cx="256" cy="302" rx="178" ry="7"
           fill="#000000" opacity="0.16"/>

  <!-- Bisagra -->
  <rect x="143" y="276" width="226" height="9" rx="4.5"
        fill="#90939c"/>
  <rect x="151" y="277" width="210" height="2" rx="1"
        fill="#6f727b" opacity="0.55"/>

  <!-- Carcasa de la pantalla -->
  <rect x="56" y="22" width="400" height="258" rx="18" ry="18"
        fill="url(#lid)"/>
  <rect x="56" y="22" width="400" height="258" rx="18" ry="18"
        fill="none" stroke="url(#edge)" stroke-width="1.4"/>

  <!-- Bisel -->
  <rect x="61" y="27" width="390" height="248" rx="14" ry="14"
        fill="url(#bezel)"/>

  <!-- Pantalla -->
  <rect x="76" y="40" width="360" height="216" rx="5" ry="5"
        fill="#0a0a0e"/>

  <g clip-path="url(#screenClip)">
    <rect x="76" y="40" width="360" height="216"
          fill="url(#wallpaper)"/>

    <!-- Auroras del fondo de pantalla -->
    <ellipse cx="135" cy="92" rx="150" ry="112"
             fill="url(#glowBlue)"/>
    <ellipse cx="390" cy="220" rx="140" ry="120"
             fill="url(#glowPink)"/>

    <!-- Olas fluidas -->
    <path d="M76 172 C136 108 204 232 278 174
             S392 104 436 143 L436 256 L76 256 Z"
          fill="#2f7bff" opacity="0.28"/>
    <path d="M76 198 C148 146 216 246 302 188
             S406 138 436 172 L436 256 L76 256 Z"
          fill="#a25cff" opacity="0.30"/>
    <path d="M76 226 C160 188 238 264 332 222
             S416 192 436 214 L436 256 L76 256 Z"
          fill="#ff7cc9" opacity="0.22"/>

    <!-- Brillo de cristal -->
    <path d="M76 40 L198 40 L116 256 L76 256 Z"
          fill="#ffffff" opacity="0.05"/>
    <path d="M290 40 L330 40 L210 256 L170 256 Z"
          fill="#ffffff" opacity="0.025"/>
  </g>

  <!-- Borde interior de la pantalla -->
  <rect x="76" y="40" width="360" height="216" rx="5" ry="5"
        fill="none" stroke="#000000" stroke-opacity="0.55"
        stroke-width="1"/>

  <!-- Cámara -->
  <circle cx="256" cy="33.5" r="2.4" fill="#3b3b42"/>
  <circle cx="256" cy="33.5" r="0.9" fill="#89a8ff" opacity="0.8"/>

  <!-- Base del MacBook -->
  <rect x="34" y="279" width="444" height="19" rx="9.5" ry="9.5"
        fill="url(#base)"/>
  <rect x="40" y="280" width="432" height="2.6" rx="1.3"
        fill="#ffffff" opacity="0.78"/>
  <rect x="48" y="295.4" width="416" height="1.6" rx="0.8"
        fill="#777a83" opacity="0.55"/>

  <!-- Muesca de apertura -->
  <rect x="237" y="280.4" width="38" height="3.4" rx="1.7"
        fill="#7f828a" opacity="0.45"/>
</svg>
