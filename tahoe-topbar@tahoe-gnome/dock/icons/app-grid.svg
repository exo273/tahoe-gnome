<?xml version="1.0" encoding="UTF-8"?>
<!-- Launchpad del Dock: cuadrícula 3x3 de colores sobre una tarjeta clara. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8ed"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="2.5" width="43" height="43" rx="10.5" fill="url(#card)" stroke="#c7c7cc" stroke-width="1"/>
  <g>
    <rect x="10" y="10" width="8" height="8" rx="2" fill="#ff3b30"/>
    <rect x="20" y="10" width="8" height="8" rx="2" fill="#ff9500"/>
    <rect x="30" y="10" width="8" height="8" rx="2" fill="#ffcc00"/>
    <rect x="10" y="20" width="8" height="8" rx="2" fill="#34c759"/>
    <rect x="20" y="20" width="8" height="8" rx="2" fill="#00c7be"/>
    <rect x="30" y="20" width="8" height="8" rx="2" fill="#0a84ff"/>
    <rect x="10" y="30" width="8" height="8" rx="2" fill="#af52de"/>
    <rect x="20" y="30" width="8" height="8" rx="2" fill="#ff2d55"/>
    <rect x="30" y="30" width="8" height="8" rx="2" fill="#8e8e93"/>
  </g>
</svg>
